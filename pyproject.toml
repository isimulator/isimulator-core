[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isimulator-core"
version = "0.2.0"
description = "iSimulator simulation runtime: engine-neutral execution of iTwin declarative simulation specifications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "simpy>=4.0,<5.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
isimulator-replay = "isimulator_core.replay:main"

[tool.setuptools.packages.find]
include = ["isimulator_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
